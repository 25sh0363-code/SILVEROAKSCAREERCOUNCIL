name: Keep Supabase Awake

on:
  schedule:
    # Runs every 3 days at 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send REST Request
        run: |
          echo "Pinging Supabase REST API..."
          # Replace 'todos' with any real table name in your database, or keep 'todos' if anonymous read is allowed
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "https://wicihqhrjgcikcyurbtd.supabase.co/rest/v1/counselors?select=id&limit=1" \
            -H "apikey: sb_publishable_ZgwGLXUMusAEhv1ghHdRGg_cnzDn4Of")
          
          echo "Response code: $RESPONSE_CODE"
          # 200 = Success, 206 = Partial Content
          if [ "$RESPONSE_CODE" -eq 200 ] || [ "$RESPONSE_CODE" -eq 206 ]; then
            echo "Successfully connected and queried Supabase!"
          else
            echo "Failed to query REST endpoint. Code: $RESPONSE_CODE"
            exit 1
          fi
