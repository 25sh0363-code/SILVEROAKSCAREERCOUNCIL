name: Keep Supabase Awake

on:
  schedule:
    # Runs every 3 days at 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send REST Request
        run: |
          echo "Pinging Supabase REST API..."
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/counselors?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          
          echo "Response code: $RESPONSE_CODE"
          if [ "$RESPONSE_CODE" -eq 200 ] || [ "$RESPONSE_CODE" -eq 206 ]; then
            echo "Successfully connected and queried Supabase!"
          else
            echo "Failed to query REST endpoint. Code: $RESPONSE_CODE"
            exit 1
          fi
