name: Keep Supabase Awake

on:
  schedule:
    - cron: '0 0 * * 1,4'   # Mon & Thu
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send Heartbeat
        run: |
          echo "Sending heartbeat to Supabase..."
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/heartbeat" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{}')

          echo "Response code: $RESPONSE_CODE"
          if [ "$RESPONSE_CODE" -eq 201 ] || [ "$RESPONSE_CODE" -eq 200 ]; then
            echo "Heartbeat recorded successfully!"
          else
            echo "Failed to insert heartbeat. Code: $RESPONSE_CODE"
            exit 1
          fi
