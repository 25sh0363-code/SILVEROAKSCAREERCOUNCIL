name: Keep Supabase Awake

on:
  schedule:
    # Runs every 3 days at 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send API request to Supabase REST API
        run: |
          echo "Pinging Supabase REST API..."
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "https://wicihqhrjgcikcyurbtd.supabase.co/rest/v1/" \
            -H "apikey: sb_publishable_ZgwGLXUMusAEhv1ghHdRGg_cnzDn4Of" \
            -H "Authorization: Bearer sb_publishable_ZgwGLXUMusAEhv1ghHdRGg_cnzDn4Of")
          
          echo "Response code: $RESPONSE_CODE"
          if [ "$RESPONSE_CODE" -eq 200 ]; then
            echo "Successfully pinged Supabase PostgREST API! Activity registered."
          else
            echo "Failed to connect to REST endpoint. Received status code $RESPONSE_CODE"
            exit 1
          fi
